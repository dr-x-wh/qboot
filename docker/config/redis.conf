# =========================================
# Redis main configuration
# File encoding: UTF-8
# Time zone: controlled by container TZ=Asia/Shanghai
# =========================================

# 监听地址
# 允许容器网络访问 Redis
bind 0.0.0.0

# Redis 端口
port 6379

# Docker Hub 官方页说明该镜像默认会关闭 protected mode 以便容器网络访问。
# 这里显式关闭，并通过 requirepass 提供认证。
protected-mode no

# 前台运行，交给 Docker 管理进程
daemonize no

# 数据目录，官方镜像持久化目录为 /data
dir /data

# 日志输出到 stdout/stderr，由 Docker logs 接管
logfile ""
loglevel notice

# 数据库数量
databases 16

# RDB 快照持久化
save 900 1
save 300 10
save 60 10000

# RDB 文件名
dbfilename dump.rdb

# 启用 AOF，适合更高数据安全要求
appendonly yes
appendfilename "appendonly.aof"

# AOF 刷盘策略
# everysec 是性能和可靠性之间的常见折中
appendfsync everysec

# 避免 AOF 重写期间额外 fsync 抖动
no-appendfsync-on-rewrite no

# AOF 自动重写
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 内存策略
# 不在配置里硬编码 maxmemory，避免误伤；需要限制时再按宿主机内存设置。
# maxmemory 512mb
# maxmemory-policy allkeys-lru

# 慢查询日志
slowlog-log-slower-than 10000
slowlog-max-len 128

# 延迟监控，0 表示关闭
latency-monitor-threshold 0

# 禁止高风险命令，可按需开启。
# Redis 官方文档提示 rename-command 方式已不推荐长期依赖，ACL 更适合细粒度控制。
# rename-command FLUSHALL ""
# rename-command FLUSHDB ""
# rename-command CONFIG ""