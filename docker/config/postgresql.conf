# =========================================
# PostgreSQL main configuration
# File encoding: UTF-8
# Time zone: Asia/Shanghai
# =========================================

# 允许 Docker 网络内其他容器访问。
# 如果使用自定义配置文件，Docker Hub 官方说明要求设置 listen_addresses = '*'
listen_addresses = '*'
port = 5432

# 编码相关
# server_encoding 由 initdb 的 --encoding=UTF8 决定，不能只靠这里修改已有数据库。
client_encoding = 'UTF8'

# 时区相关
timezone = 'Asia/Shanghai'
log_timezone = 'Asia/Shanghai'

# 密码加密方式
password_encryption = 'scram-sha-256'

# 日志输出给 Docker，由 docker logs / compose logs 接管
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error

# 基础连接配置；生产环境按实际负载调整
max_connections = 100

# 基础内存配置；生产环境按容器内存调整
shared_buffers = 256MB