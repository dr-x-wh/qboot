# =========================================
# RabbitMQ main configuration
# File encoding: UTF-8
# Time zone: controlled by container TZ=Asia/Shanghai
# =========================================

# -----------------------------------------
# Listeners
# -----------------------------------------

# AMQP 0-9-1 / AMQP 1.0 明文 TCP 监听端口
listeners.tcp.default = 5672

# Management UI / HTTP API
# management 镜像已默认安装并启用 rabbitmq_management 插件
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0

# -----------------------------------------
# Initial vhost / user
# -----------------------------------------
# RabbitMQ 只会在数据库首次初始化时创建 default_vhost/default_user。
# 已存在数据卷时，修改这些值不会自动修改已有用户或 vhost。

default_vhost = '$(RMQ_DEFAULT_VHOST)'
default_user = '$(RMQ_DEFAULT_USER)'
default_pass = '$(RMQ_DEFAULT_PASS)'

# 给初始化用户管理员权限，便于登录 Management UI。
# 生产环境可改为 management 或 monitoring 等更小权限。
default_user_tags.administrator = true

# 初始化用户在 default_vhost 上的权限
default_permissions.configure = .*
default_permissions.read = .*
default_permissions.write = .*

# 保留默认 guest 账号只能本机登录的限制。
# 不建议设置 loopback_users = none。
loopback_users.guest = true

# -----------------------------------------
# Connection / protocol defaults
# -----------------------------------------

# AMQP heartbeat，默认 60 秒；显式写出便于维护。
heartbeat = 60

# 最大 channel 数。0 表示无限制，不建议。
channel_max = 2047

# 最大消息体大小，默认 16 MiB。
max_message_size = 16777216

# -----------------------------------------
# Resource alarms
# -----------------------------------------

# 磁盘剩余空间低于该值时触发 flow control。
# 官方文档提示生产环境应重新评估默认磁盘阈值。
disk_free_limit.absolute = 2GB

# 内存水位线。
# 未明确容器内存限制时，不建议盲目写死 absolute。
# 如果你给容器设置了固定内存，可按实际值改成：
# vm_memory_high_watermark.absolute = 512MB

# -----------------------------------------
# Logging
# -----------------------------------------

# 日志级别
log.file.level = info

# -----------------------------------------
# Statistics / Management
# -----------------------------------------

# management 插件统计采集间隔，单位毫秒。
collect_statistics_interval = 5000