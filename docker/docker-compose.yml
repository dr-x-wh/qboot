name: app

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      LANG: C.UTF-8
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-${POSTGRES_USER}}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro

  redis:
    image: redis:8.10.1
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      LANG: C.UTF-8
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./conf/redis.conf:/usr/local/etc/redis/redis.conf:ro

  rabbitmq:
    image: rabbitmq:4.3.5-management
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      SEED_USERNAME: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      SEED_USER_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./conf/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: