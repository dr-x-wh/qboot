name: qboot

services:
  redis:
    image: redis:${REDIS_TAG}
    restart: unless-stopped

    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}

    ports:
      - "${DOCKER_BIND_ADDRESS:-0.0.0.0}:${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro

    # 密码由环境变量注入，不写入 redis.conf
    # 注意：这是 Compose 环境下的实用方案，但密码仍可能出现在容器运行时参数或 Docker 元数据中。
    command:
      - sh
      - -c
      - |
        exec redis-server /usr/local/etc/redis/redis.conf \
          --requirepass "$${REDIS_PASSWORD}"

    healthcheck:
      test: [ "CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:${POSTGRES_TAG}
    restart: unless-stopped

    shm_size: 256mb

    ports:
      - "${DOCKER_BIND_ADDRESS:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"

    environment:
      TZ: Asia/Shanghai
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --auth-host=scram-sha-256"
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-qboot}

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro

    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h 127.0.0.1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rabbitmq:
    image: rabbitmq:${RABBITMQ_TAG}
    hostname: rabbitmq
    restart: unless-stopped
    stop_grace_period: 30s

    environment:
      TZ: Asia/Shanghai
      RABBITMQ_NODENAME: ${RABBITMQ_NODENAME:-rabbit@rabbitmq}
      RABBITMQ_CONFIG_FILE: /etc/rabbitmq/rabbitmq.conf
      RMQ_DEFAULT_USER: ${RMQ_DEFAULT_USER:-admin}
      RMQ_DEFAULT_PASS: ${RMQ_DEFAULT_PASS:-123456}
      RMQ_DEFAULT_VHOST: ${RMQ_DEFAULT_VHOST:-qboot}

    ports:
      - "${DOCKER_BIND_ADDRESS:-0.0.0.0}:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${DOCKER_BIND_ADDRESS:-0.0.0.0}:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics -q ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


volumes:
  redis_data:
  postgres_data:
  rabbitmq_data:
