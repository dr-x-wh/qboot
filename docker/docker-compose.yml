name: qboot

services:
  postgres:
    image: postgres:18.6
    hostname: postgres
    restart: unless-stopped

    environment:
      TZ: Asia/Shanghai
      LANG: C.UTF-8

      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-${POSTGRES_USER}}

    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - timezone=Asia/Shanghai

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8.10.0
    hostname: redis
    restart: unless-stopped

    environment:
      TZ: Asia/Shanghai
      LANG: C.UTF-8

    command:
      - redis-server
      - --bind
      - 0.0.0.0
      - --protected-mode
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:4.3.5-management
    hostname: rabbitmq
    restart: unless-stopped

    environment:
      TZ: Asia/Shanghai
      LANG: C.UTF-8

      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: